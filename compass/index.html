<meta name="theme-color" content="#000000">
<meta name="description" content="Live compass that works offline: heading, true/magnetic, bearing lock with steering, back bearing, sun check, waypoint direction, camera sighting and bearing log.">

<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/compass.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/common.js" defer></script>
<script src="../assets/vendor/suncalc.js" defer></script>
<script src="../assets/vendor/mgrs.min.js" defer></script>
<script src="../assets/js/store.js" defer></script>
<script src="../assets/js/geo.js" defer></script>
<script src="../assets/js/compass.js" defer></script>
<script src="../assets/js/compass-ui.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <a class="hdr-btn" href="../index.html" aria-label="Back to hub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Hub</span></a>
  <h1>Compass</h1>
  <a class="hdr-btn" href="../map/index.html" aria-label="Open the map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></a>
  <span class="net-dot" role="img"></span>
  <button class="hdr-btn" type="button" data-theme-toggle></button>
</header>
<main id="main" class="page" style="padding-top:8px">
  <div id="compass"></div>
  <p class="muted" id="gps-note" style="font-size:.9rem"></p>
  <noscript><p>The compass needs JavaScript.</p></noscript>
</main>
<script>
/* Page glue: GPS (for waypoint bearings, sun position and the GPS-course fallback)
   + mount the shared compass UI. Everything runs on the device, no network. */
document.addEventListener('DOMContentLoaded', function () {
  var fix = null, watch = null;
  function startGps() {
    if (!('geolocation' in navigator)) { note('No GPS in this browser — compass still works.'); return; }
    if (!window.isSecureContext) { note('GPS is blocked on this address (needs https:// or http://localhost). The compass still works.'); return; }
    watch = navigator.geolocation.watchPosition(function (p) {
      var c = p.coords;
      fix = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude,
              speed: c.speed != null && !isNaN(c.speed) ? c.speed : null,
              course: c.heading != null && !isNaN(c.heading) ? c.heading : null, t: p.timestamp || Date.now() };
      OGCompass.feedGps(fix);
      note('');
      try { localStorage.setItem('ogsk.lastfix', JSON.stringify(fix)); } catch (e) {}
    }, function (e) {
      note(e.code === 1 ? 'Location permission denied — waypoint bearings need GPS; the compass itself still works.' : 'Waiting for GPS…');
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  }
  function note(t) { document.getElementById('gps-note').textContent = t; }
  OGCompass.loadDeclination().then(function () {
    var ui = OGCompassUI.mount(document.getElementById('compass'), { getFix: function () { return fix && Date.now() - fix.t < 120000 ? fix : null; } });
    ui.setActive(true);
    document.addEventListener('visibilitychange', function () { ui.setActive(document.visibilityState === 'visible'); });
  });
  startGps();
});
</script>
</body>
</html>
