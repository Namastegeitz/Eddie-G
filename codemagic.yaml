  monkey-do-ios:
    name: Monkey Do iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Eddie-G ASC key
    environment:
      xcode: 26.6
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.namastegeitz.monkeydo
      vars:
        APP_DIR: apps/monkey-see-monkey-do
    triggering:
      events: []
    scripts:
      - name: Tests and web bundle
        script: |
          set -e
          cd "$APP_DIR"
          node tests/unit.mjs
          node scripts/build_web.mjs
      - name: Capacitor sync
        script: |
          set -e
          cd "$APP_DIR/mobile"
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles --project "$APP_DIR/mobile/ios/App/App.xcodeproj"
      - name: Build number
        script: |
          # Info.plist reads $(CURRENT_PROJECT_VERSION); the project has no
          # VERSIONING_SYSTEM, so agvtool can't be used. Set it directly.
          cd "$APP_DIR/mobile/ios/App"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $((BUILD_NUMBER + 100));/g" App.xcodeproj/project.pbxproj
          grep -m1 'CURRENT_PROJECT_VERSION' App.xcodeproj/project.pbxproj
      - name: Build the .ipa
        script: xcode-project build-ipa --project "$APP_DIR/mobile/ios/App/App.xcodeproj" --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
