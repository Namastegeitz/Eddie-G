# Codemagic: builds the Alien Sudoku iOS app on a cloud Mac and uploads it to TestFlight.
# For publishing without your own Mac. Codemagic's free plan includes 500 macOS minutes
# a month; one build takes about 10-15 minutes.
#
# One-time setup (ALIEN-SUDOKU/store-launch/STEP-BY-STEP.md, Apple steps):
#   1. Sign in at codemagic.io with GitHub and add the Eddie-G repository.
#   2. Team settings > Integrations > Developer Portal: add your App Store Connect
#      API key (Admin role) and name it exactly: Alien Sudoku ASC key
#   3. Later, in the app's Environment variables, in a group named "alien-sudoku", then turn
#      on the two "groups" lines below:
#        ADMOB_IOS_APP_ID            ca-app-pub-...~...   (until then: Google's test ads)
#        VITE_SENTRY_DSN             https://...ingest.sentry.io/...   (crash reports, Sentry)
#        FIREBASE_IOS_PLIST_BASE64   GoogleService-Info.plist as base64 (Crashlytics, Remote Config)
#      Each is optional; without it that service simply stays off.
#   4. Start the "Alien Sudoku iOS (TestFlight)" workflow on your branch.
# Codemagic creates the signing certificate and App Store profile by itself through
# the API key, so no Mac or Xcode is needed at any point.

workflows:
  alien-sudoku-ios:
    name: Alien Sudoku iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Alien Sudoku ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eddieg.aliensudoku
      # groups:
      #   - alien-sudoku
      node: 22
      xcode: latest
      vars:
        APP_DIR: ALIEN-SUDOKU/game
        # Builds 1-99 were reserved for earlier pipelines; Codemagic's counter is added on top.
        BUILD_OFFSET: 100
    triggering:
      events: []   # start builds by hand from the Codemagic dashboard
    scripts:
      - name: Install packages
        script: cd "$APP_DIR" && npm ci
      - name: Unit tests (the build stops if any fail)
        script: cd "$APP_DIR" && npx vitest run
      - name: AdMob app id (test ads until it is set)
        script: |
          cd "$APP_DIR"
          if [ -n "$ADMOB_IOS_APP_ID" ]; then node tools/set-admob-ids.mjs; else echo "No ADMOB_IOS_APP_ID: using Google's test ads"; fi
      - name: Firebase config (only when FIREBASE_IOS_PLIST_BASE64 is set)
        script: |
          cd "$APP_DIR"
          if [ -n "$FIREBASE_IOS_PLIST_BASE64" ]; then
            echo "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
            gem list -i xcodeproj > /dev/null || gem install xcodeproj --user-install
            ruby tools/ios-add-resource.rb ios/App/App.xcodeproj App/GoogleService-Info.plist
          else
            echo "No Firebase config: Crashlytics and Remote Config stay off"
          fi
      - name: Build the game and copy it into the iOS app
        script: cd "$APP_DIR" && npm run build && npx cap sync ios
      - name: Apply signing files
        script: xcode-project use-profiles
      - name: Build the .ipa
        script: |
          cd "$APP_DIR/ios/App"
          BUILD=$((BUILD_NUMBER + BUILD_OFFSET))
          echo "Build number $BUILD"
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD"
    artifacts:
      - ALIEN-SUDOKU/game/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------------------------------------------------------------------------------------
  # Android: tests, then a signed upload file (.aab) for Google Play. It only builds; upload
  # the .aab yourself in Play Console (Codemagic can publish too, but only with your go).
  # One-time setup: Team settings > Code signing identities > Android keystores > upload
  # alien-sudoku-upload.jks with reference name "alien-sudoku-upload" (password from the .txt).
  # Optional variables (group "alien-sudoku"): FIREBASE_ANDROID_JSON_BASE64 (google-services.json
  # as base64), VITE_SENTRY_DSN, ADMOB_ANDROID_APP_ID, VITE_ADMOB_ANDROID_BANNER/_INTERSTITIAL/_REWARDED.
  alien-sudoku-android:
    name: Alien Sudoku Android (Play upload file)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      android_signing:
        - alien-sudoku-upload
      # groups:
      #   - alien-sudoku
      node: 22
      java: 21
      vars:
        APP_DIR: ALIEN-SUDOKU/game
        BUILD_OFFSET: 100
    triggering:
      events: []
    scripts:
      - name: Install packages
        script: cd "$APP_DIR" && npm ci
      - name: Unit tests (the build stops if any fail)
        script: cd "$APP_DIR" && npx vitest run
      - name: Firebase and AdMob config (each only when set)
        script: |
          cd "$APP_DIR"
          if [ -n "$FIREBASE_ANDROID_JSON_BASE64" ]; then echo "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > android/app/google-services.json; fi
          if [ -n "$ADMOB_ANDROID_APP_ID" ]; then node tools/set-admob-ids.mjs; fi
      - name: Build the game and copy it into the Android app
        script: cd "$APP_DIR" && npm run build && npx cap sync android
      - name: Build the signed .aab
        script: |
          cd "$APP_DIR/android"
          export ANDROID_KEYSTORE_PATH="$CM_KEYSTORE_PATH" ANDROID_KEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$CM_KEY_ALIAS" ANDROID_KEY_PASSWORD="$CM_KEY_PASSWORD"
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew bundleRelease -PversionCode=$((BUILD_NUMBER + BUILD_OFFSET)) -PversionName=$VERSION
    artifacts:
      - ALIEN-SUDOKU/game/android/app/build/outputs/bundle/release/*.aab
      - ALIEN-SUDOKU/game/android/app/build/outputs/mapping/release/mapping.txt
