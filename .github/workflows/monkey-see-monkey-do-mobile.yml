# Monkey See, Monkey Do: phone builds on GitHub's machines.
# Runs only when started by hand (Actions tab > this workflow > Run workflow)
# or when a tag like monkey-v1.0.0 is pushed, so ordinary pushes don't use minutes.
#
# Produces (download from the run's Artifacts):
#   monkey-android-debug   APK you can install on any Android 7+ phone
#   monkey-android-release Google Play bundle (.aab), signed when the MONKEY_* secrets are set
#   monkey-ios-simulator   app for the iOS Simulator (Xcode)
#   monkey-ios-unsigned    unsigned .ipa (sign with your Apple account to install on an iPhone)
#   monkey-web             dist/www to host anywhere (installable from the browser)
#
# Optional secrets for a signed Play bundle: MONKEY_KEYSTORE_BASE64 (base64 of upload.jks),
# MONKEY_KEYSTORE_PASSWORD, MONKEY_KEY_ALIAS, MONKEY_KEY_PASSWORD.
name: Monkey See Monkey Do (phones)

on:
  workflow_dispatch:
  push:
    tags: ['monkey-v*']

defaults:
  run:
    working-directory: apps/monkey-see-monkey-do

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rule checks
        run: node tests/unit.mjs
      - name: Build dist/www
        run: node scripts/build_web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: monkey-web
          path: apps/monkey-see-monkey-do/dist/www

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web bundle + Capacitor sync
        run: |
          node scripts/build_web.mjs
          cd mobile && npm ci --no-audit --no-fund && npx cap sync android
      - name: Debug APK
        working-directory: apps/monkey-see-monkey-do/mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Release bundle
        working-directory: apps/monkey-see-monkey-do/mobile/android
        env:
          MONKEY_KEYSTORE_BASE64: ${{ secrets.MONKEY_KEYSTORE_BASE64 }}
          MONKEY_KEYSTORE_PASSWORD: ${{ secrets.MONKEY_KEYSTORE_PASSWORD }}
          MONKEY_KEY_ALIAS: ${{ secrets.MONKEY_KEY_ALIAS }}
          MONKEY_KEY_PASSWORD: ${{ secrets.MONKEY_KEY_PASSWORD }}
        run: |
          if [ -n "$MONKEY_KEYSTORE_BASE64" ]; then
            echo "$MONKEY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export MONKEY_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: monkey-android-debug
          path: apps/monkey-see-monkey-do/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: monkey-android-release
          path: apps/monkey-see-monkey-do/mobile/android/app/build/outputs/bundle/release/*.aab

  ios:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web bundle + Capacitor sync
        run: |
          node scripts/build_web.mjs
          cd mobile && npm ci --no-audit --no-fund && npx cap sync ios
      - name: Simulator build
        working-directory: apps/monkey-see-monkey-do/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/MonkeyDo-simulator.zip" App.app
      - name: Unsigned device build (.ipa)
        working-directory: apps/monkey-see-monkey-do/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p build/Payload && cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -qry "$GITHUB_WORKSPACE/MonkeyDo-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: monkey-ios-simulator
          path: MonkeyDo-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: monkey-ios-unsigned
          path: MonkeyDo-unsigned.ipa
