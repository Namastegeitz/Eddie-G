# CANOPY CROSSING: release builds for every store, each platform in its own folder.
#
# Builds with Godot 4.7.2 on GitHub's machines (tools/build_all.sh) and keeps
# each platform as its own download on the run page:
#   canopy-crossing-android   .apk (install directly) + .aab (upload to Google Play)
#   canopy-crossing-windows   Steam / GOG / itch.io / Epic / Microsoft Store
#   canopy-crossing-macos     universal .app (sign + notarize before shipping)
#   canopy-crossing-linux     Steam / GOG / itch.io
#   canopy-crossing-ios       Xcode project (archive on a Mac -> App Store Connect)
#   canopy-crossing-web       the web version
# Pushing a tag like canopy-release-v1.0.0 also makes a draft GitHub Release
# with all of them attached.
#
# Runs when started by hand (Actions tab > "Canopy Crossing release builds" >
# Run workflow) or on a canopy-release-v* tag, so ordinary pushes use no minutes.
#
# Google Play needs the .aab signed with YOUR upload key. Set these repository
# secrets (Settings > Secrets and variables > Actions) once:
#   CANOPY_ANDROID_KEYSTORE_BASE64  base64 of your upload .keystore
#   CANOPY_ANDROID_KEY_ALIAS        its key alias
#   CANOPY_ANDROID_KEY_PASSWORD     its password
# Without them the Android files are signed with a throwaway test key: fine
# for phones, NOT uploadable to Play (Play remembers the first key you use).
#
# Crash reporting (optional, free tiers; see apps/CANOPY-CROSSING/docs/CRASH_REPORTING.md):
#   SENTRY_DSN                  the Sentry project's DSN: installs the Sentry SDK
#                               into the store builds (Android .aab, iOS, Windows, macOS, Linux)
#   FIREBASE_ANDROID_CONFIG     the contents of google-services.json: builds
#                               Firebase Crashlytics into the Android .aab
# Without them the builds have no crash reporting (as before).
#
# Version: from project.godot; build number: the commit count, so every build
# of a later commit has a higher number and a tag always rebuilds the same one.
name: Canopy Crossing release builds

on:
  workflow_dispatch:
  push:
    tags: ['canopy-release-v*']

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_DIR: ${{ github.workspace }}/../godot

defaults:
  run:
    working-directory: apps/CANOPY-CROSSING

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot and export templates
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-all-platforms-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} and the templates for every platform
        run: |
          set -e
          mkdir -p "$GODOT_DIR"
          if [ ! -x "$GODOT_DIR/godot" ]; then
            base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
            curl -sSLo "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            mv "$RUNNER_TEMP"/godot/Godot_v*_linux.x86_64 "$GODOT_DIR/godot"
            curl -sSLo "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$GODOT_DIR/templates"
            unzip -q -j -o "$RUNNER_TEMP/templates.tpz" templates/version.txt \
              templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
              templates/windows_release_x86_64.exe templates/macos.zip templates/ios.zip \
              templates/linux_release.x86_64 templates/android_release.apk templates/android_debug.apk \
              templates/android_source.zip -d "$GODOT_DIR/templates"
            rm -f "$RUNNER_TEMP/templates.tpz"
          fi
          dest="$HOME/.local/share/godot/export_templates/$(cat "$GODOT_DIR/templates/version.txt")"
          mkdir -p "$dest" && cp "$GODOT_DIR"/templates/* "$dest/"
          sudo ln -sf "$GODOT_DIR/godot" /usr/local/bin/godot
          godot --version

      - name: Import the project and check it compiles
        run: |
          timeout 600 godot --headless --path . --import > "$RUNNER_TEMP/import.log" 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/import.log"; then exit 1; fi
          tools/parse_check.sh | tee "$RUNNER_TEMP/parse.log" && grep -q "bad=0" "$RUNNER_TEMP/parse.log"

      - name: Android signing (your upload key, or a throwaway test key)
        env:
          KEYSTORE_B64: ${{ secrets.CANOPY_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CANOPY_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CANOPY_ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          ks="$RUNNER_TEMP/upload.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"; alias="$KEY_ALIAS"; pass="$KEY_PASS"
            echo "Signing with your upload key."
          else
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android -alias test \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Canopy Crossing test, O=Canopy Crossing, C=US"
            alias=test; pass=android
            echo "::warning::No upload key secrets: Android files use a throwaway test key (not for Google Play)."
          fi
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "%s"\nexport/android/debug_keystore_pass = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" "$ks" "$alias" "$pass" > "$HOME/.config/godot/editor_settings-4.7.tres"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"; echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$alias"; echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$pass"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"; echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias"; echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Build number (commit count) and version
        id: v
        run: |
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          python3 tools/set_version.py "$version" "$build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Browser for the web build's tap test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Build the web version and the phone APK (no crash-reporting SDKs in these two)
        run: tools/build_all.sh web android

      - name: Crash reporting - Sentry (when SENTRY_DSN is set)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SENTRY_DSN" ]; then tools/install_sentry.sh
          else echo "::notice::No SENTRY_DSN secret: store builds have no Sentry crash reports."; fi

      - name: Store rating card (In-app Review plugin, Android .aab + iOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/install_review.sh

      - name: Crash reporting - Firebase Crashlytics for Android (when FIREBASE_ANDROID_CONFIG is set)
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > "$RUNNER_TEMP/google-services.json"
            tools/build_crashlytics.sh "$RUNNER_TEMP/google-services.json"
            rm -f "$RUNNER_TEMP/google-services.json"
          else echo "::notice::No FIREBASE_ANDROID_CONFIG secret: the Android .aab has no Crashlytics."; fi
          timeout 600 godot --headless --path . --import > "$RUNNER_TEMP/import2.log" 2>&1 || true

      - name: Build the store versions (Play .aab, iOS, Windows, macOS, Linux)
        run: tools/build_all.sh windows macos linux ios aab

      - name: Google Play pre-checks (16 KB pages, target API 36, permissions)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://dl.google.com/android/maven2/com/android/tools/build/bundletool/1.18.3/bundletool-1.18.3.jar
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" tools/check_android.sh BUILDS/android/CanopyCrossing.apk BUILDS/android/CanopyCrossing.aab

      - uses: actions/upload-artifact@v7
        with: { name: 'canopy-crossing-android-${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}', path: apps/CANOPY-CROSSING/BUILDS/android, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: 'canopy-crossing-windows-${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}', path: apps/CANOPY-CROSSING/BUILDS/windows, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: 'canopy-crossing-macos-${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}', path: apps/CANOPY-CROSSING/BUILDS/macos, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: 'canopy-crossing-linux-${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}', path: apps/CANOPY-CROSSING/BUILDS/linux, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: 'canopy-crossing-ios-${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}', path: apps/CANOPY-CROSSING/BUILDS/ios, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: 'canopy-crossing-web-${{ steps.v.outputs.version }}-${{ steps.v.outputs.build }}', path: apps/CANOPY-CROSSING/BUILDS/web, if-no-files-found: error }

      - name: Draft GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/canopy-release-v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Canopy Crossing ${{ steps.v.outputs.version }} (build ${{ steps.v.outputs.build }})
          files: |
            apps/CANOPY-CROSSING/BUILDS/android/*.apk
            apps/CANOPY-CROSSING/BUILDS/android/*.aab
            apps/CANOPY-CROSSING/BUILDS/windows/*.zip
            apps/CANOPY-CROSSING/BUILDS/macos/*.zip
            apps/CANOPY-CROSSING/BUILDS/linux/*.zip
            apps/CANOPY-CROSSING/BUILDS/ios/*.zip
            apps/CANOPY-CROSSING/BUILDS/web/*.zip
