# Canopy Crossing: public beta for phones, built on GitHub's machines.
#
# Builds the web version and an Android APK with Godot 4.7.2, checks that
# first person works by touch in a phone-sized browser, and publishes a beta
# site to GitHub Pages:
#   https://<owner>.github.io/<repo>/canopy-crossing/
# (a tester page with Play, Add to Home Screen for iPhone and Android, and
# the APK download). Also keeps the APK as a run artifact.
#
# Runs when started by hand (Actions tab > this workflow > Run workflow) or
# when a tag like canopy-v0.9.1 is pushed, so ordinary pushes use no minutes.
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".
#
# The APK (Godot's release engine) is signed with a beta key kept in the Actions cache, so new builds
# install over old ones. For a permanent key, set the secrets
# CANOPY_ANDROID_KEYSTORE_BASE64 (base64 of a .keystore), CANOPY_ANDROID_KEY_ALIAS
# and CANOPY_ANDROID_KEY_PASSWORD.
name: Canopy Crossing beta (web + Android)

on:
  workflow_dispatch:
  push:
    tags: ['canopy-v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canopy-beta-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_DIR: ${{ github.workspace }}/../godot

defaults:
  run:
    working-directory: apps/canopy-crossing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-web-android-v1

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -e
          mkdir -p "$GODOT_DIR"
          if [ ! -x "$GODOT_DIR/godot" ]; then
            base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
            curl -sSLo "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            mv "$RUNNER_TEMP"/godot/Godot_v*_linux.x86_64 "$GODOT_DIR/godot"
            curl -sSLo "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$GODOT_DIR/templates"
            # only what this game exports: the non-threaded web build and Android
            unzip -q -j -o "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/web_nothreads_release.zip \
              templates/web_nothreads_debug.zip templates/android_debug.apk templates/android_release.apk -d "$GODOT_DIR/templates"
            rm -f "$RUNNER_TEMP/templates.tpz"
          fi
          dest="$HOME/.local/share/godot/export_templates/$(cat "$GODOT_DIR/templates/version.txt")"
          mkdir -p "$dest" && cp "$GODOT_DIR"/templates/* "$dest/"
          sudo ln -sf "$GODOT_DIR/godot" /usr/local/bin/godot
          godot --version

      - name: Import the project
        run: |
          timeout 600 godot --headless --path . --import > "$RUNNER_TEMP/import.log" 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Compile check
        run: tools/parse_check.sh | tee "$RUNNER_TEMP/parse.log" && grep -q "bad=0" "$RUNNER_TEMP/parse.log"

      - name: Web export
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck

      - name: Android signing key (cached debug key, or your secret)
        id: key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/../canopy-keystore
          key: canopy-android-debug-keystore-v1

      - name: Android export (APK)
        env:
          KEYSTORE_B64: ${{ secrets.CANOPY_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CANOPY_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CANOPY_ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          ks_dir="$RUNNER_TEMP/../canopy-keystore"
          mkdir -p "$ks_dir"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks_dir/beta.keystore"
            alias="$KEY_ALIAS"; pass="$KEY_PASS"
          else
            if [ ! -s "$ks_dir/beta.keystore" ]; then
              keytool -genkeypair -keystore "$ks_dir/beta.keystore" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Canopy Crossing beta, O=Canopy Crossing, C=US"
            fi
            alias="androiddebugkey"; pass="android"
          fi
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks_dir/beta.keystore"
          export/android/debug_keystore_user = "$alias"
          export/android/debug_keystore_pass = "$pass"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.7.tres"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$ks_dir/beta.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="$alias"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$pass"
          # the release engine (faster on phones, smaller), signed with the beta key
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$ks_dir/beta.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$alias"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$pass"
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/canopycrossing.apk
          test -s build/android/canopycrossing.apk
          ls -la build/android

      - name: Beta site
        run: python3 tools/web_artifact/package.py build/web build/site --site --apk build/android/canopycrossing.apk

      - name: First person works by touch in a phone browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          mkdir -p build/web_smoke
          node tools/web_artifact/smoke.js build/site/canopy-crossing play.html build/web_smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canopy-crossing-android-apk
          path: apps/canopy-crossing/build/android/canopycrossing.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canopy-crossing-phone-test-screens
          path: apps/canopy-crossing/build/web_smoke
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/canopy-crossing/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}canopy-crossing/
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
