<!doctype html>
<html lang="en" data-root="../" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Survival Kit">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Off-Grid Survival Kit">
<meta property="og:title" content="Search — Off-Grid Survival Kit">
<meta property="og:description" content="Search every survival guide in the app — bleeding, boiling water, knots, hypothermia, foraging — instantly and with no signal.">
<meta property="og:url" content="https://namastegeitz.github.io/Eddie-G/search/">
<meta property="og:image" content="https://namastegeitz.github.io/Eddie-G/assets/icons/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Off-Grid Survival Kit: offline map, compass and survival guides">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Search every survival guide in the app — bleeding, boiling water, knots, hypothermia, foraging — instantly and with no signal.">
<title>Search — Off-Grid Survival Kit</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/common.js" defer></script>
<script src="../assets/js/search.js" defer></script>
<style>
  /* ---- search box: big, thumb-friendly ---- */
  .search-form { margin: 4px 0 6px; }
  .search-form > label { display: block; margin: 0 0 8px; font-size: 1.05rem; }
  .search-box { position: relative; display: flex; gap: 8px; }
  .search-box .s-ico {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; fill: none; stroke: var(--muted); stroke-width: 2.4;
    stroke-linecap: round; pointer-events: none;
  }
  .search-box input[type="search"] {
    flex: 1; min-width: 0; min-height: 56px; padding: 10px 52px 10px 48px;
    font-size: 1.2rem; border-width: 2px; border-radius: 12px;
  }
  .search-box input[type="search"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 55%, transparent); }
  /* our own big clear button instead of the tiny native one */
  .search-box input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-box .s-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .search-box .s-clear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
  .search-box .s-clear[hidden] { display: none; }
  .offline-note { font-size: .92rem; margin: 6px 0 4px; }

  /* ---- status line + suggestions ---- */
  #search-status { min-height: 1.5em; margin: 10px 0 6px; font-weight: 600; }
  #search-status .hint { display: block; font-weight: 400; color: var(--muted); }
  .suggest h2 { font-size: 1rem; margin: 14px 0 6px; color: var(--muted); }
  .suggest ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest button {
    min-height: 48px; padding: 0 16px; border-radius: 999px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    font: inherit; font-weight: 600; font-size: .98rem; cursor: pointer;
  }
  .suggest button:active { transform: translateY(1px); }

  /* ---- results: one big tappable card each ---- */
  .results { list-style: none; padding: 0; margin: 8px 0 16px; display: grid; gap: 10px; }
  .results li { margin: 0; }
  .result {
    display: block; min-height: 64px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .result:active { background: var(--surface-2); }
  .result:hover { border-color: var(--accent); }
  .r-page { display: block; font-size: .8rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .r-head { display: block; font-size: 1.12rem; font-weight: 700; color: var(--link); line-height: 1.3; margin: 2px 0; overflow-wrap: anywhere; }
  .r-ctx { color: var(--muted); font-weight: 600; }
  .r-sub { display: block; font-size: .92rem; color: var(--muted); margin-bottom: 2px; }
  .r-snip {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
    font-size: .95rem; color: var(--text); opacity: .88; overflow-wrap: anywhere;
  }
  .results mark { background: var(--accent); color: var(--accent-text); border-radius: 3px; padding: 0 2px; }
  :root[data-theme="red"] .results mark { background: var(--text); color: #000; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <a class="hdr-btn" href="../index.html" aria-label="Back to hub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Hub</span></a>
  <h1>Search the guides</h1>
  <span class="net-dot" role="img"></span>
  <button class="hdr-btn" type="button" data-theme-toggle></button>
</header>
<main id="main" class="page">
  <!-- Works without JavaScript too: the form just reloads this page with ?q= -->
  <form class="search-form" id="search-form" role="search" action="index.html" method="get">
    <label for="q">What do you need help with?</label>
    <div class="search-box">
      <svg class="s-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input type="search" id="q" name="q" autofocus enterkeyhint="search" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" placeholder="e.g. bleeding, boil water"
             aria-describedby="offline-note" aria-controls="results">
      <button class="s-clear" type="button" id="clear" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </form>
  <p class="offline-note muted" id="offline-note">Works offline: searches every guide saved on this phone. No signal needed.</p>

  <p id="search-status" role="status" aria-live="polite"></p>

  <div class="suggest" id="suggest">
    <h2 id="suggest-title">Try one of these</h2>
    <ul aria-labelledby="suggest-title">
      <li><button type="button" data-q="bleeding">bleeding</button></li>
      <li><button type="button" data-q="CPR">CPR</button></li>
      <li><button type="button" data-q="boil water">boil water</button></li>
      <li><button type="button" data-q="hypothermia">hypothermia</button></li>
      <li><button type="button" data-q="snake bite">snake bite</button></li>
      <li><button type="button" data-q="bowline">bowline</button></li>
      <li><button type="button" data-q="lightning">lightning</button></li>
      <li><button type="button" data-q="lost">lost</button></li>
      <li><button type="button" data-q="signal for help">signal for help</button></li>
      <li><button type="button" data-q="edible nuts">edible nuts</button></li>
    </ul>
  </div>

  <ul class="results" id="results" role="list" aria-label="Search results"></ul>

  <noscript><p class="callout warn">Search needs JavaScript. Use the <a href="../index.html">hub</a> to open a guide instead.</p></noscript>

  <footer class="page-foot">In an emergency, call for help first if you can (911 in the US, 112 in Europe and on most phones). Results open the guide at the matching section.</footer>
</main>
<script>
/* Search page glue: live results as you type (debounced), ?q= in the URL so
   Back from a result returns to the same list, suggestion chips, clear button.
   The engine itself is assets/js/search.js (window.OGSearch). */
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var input = document.getElementById('q');
  var form = document.getElementById('search-form');
  var clearBtn = document.getElementById('clear');
  var statusEl = document.getElementById('search-status');
  var list = document.getElementById('results');
  var suggest = document.getElementById('suggest');
  var esc = OGSearch.esc;
  var timer = null, lastQ = null, failed = false;

  /* Start loading the index straight away so the first keystroke is instant. */
  var loaded = OGSearch.load().catch(function (err) {
    failed = true;
    console.warn('Search index failed to load:', err);
    statusEl.innerHTML = 'Search index could not be loaded.' +
      '<span class="hint">' + (location.protocol === 'file:'
        ? 'Opened as a file: open the app from its web address or the installed app instead.'
        : 'Open the hub once while online so the app can save itself for offline use.') + '</span>';
  });

  function syncUrl(q) {
    var url = location.pathname + (q ? '?q=' + encodeURIComponent(q) : '');
    try { history.replaceState(null, '', url); } catch (e) { /* file:// etc. */ }
  }

  function run(q) {
    q = q.trim();
    clearBtn.hidden = !input.value;
    if (q === lastQ) return;
    lastQ = q;
    syncUrl(q);
    if (!q) { list.innerHTML = ''; statusEl.textContent = ''; suggest.hidden = false; return; }
    if (!OGSearch.ready) {
      if (!failed) { statusEl.textContent = 'Loading the search index…'; loaded.then(function () { lastQ = null; run(input.value); }); }
      return;
    }
    var r = OGSearch.search(q, 20);
    render(q, r);
  }

  function render(q, r) {
    var fz = Object.keys(r.fuzzy).map(function (w) { return '“' + esc(w) + '” → “' + esc(r.fuzzy[w]) + '”'; });
    if (!r.total) {
      list.innerHTML = '';
      suggest.hidden = false;
      statusEl.innerHTML = 'No results for “' + esc(q) + '”.' +
        '<span class="hint">Try one simple word (e.g. “burn”, “knot”, “water”) or check the spelling.</span>';
      return;
    }
    suggest.hidden = true;
    statusEl.innerHTML = (r.total > r.results.length
      ? 'Top ' + r.results.length + ' of ' + r.total + ' results'
      : r.total + (r.total === 1 ? ' result' : ' results')) + ' for “' + esc(q) + '”' +
      (fz.length ? '<span class="hint">Showing similar spelling: ' + fz.join(', ') + '</span>' : '') +
      (r.partial ? '<span class="hint">' + (r.exact ? 'Some results' : 'Results') + ' match only some of your words.</span>' : '');
    list.innerHTML = r.results.map(function (x) {
      var e = x.entry;
      return '<li><a class="result" href="' + esc(x.url) + '">' +
        '<span class="r-page">' + esc(e.pt) + '</span>' +
        '<span class="r-head">' + (x.ctxHtml ? '<span class="r-ctx">' + x.ctxHtml + ' › </span>' : '') + x.headHtml + '</span>' +
        (x.subHtml ? '<span class="r-sub">' + x.subHtml + '</span>' : '') +
        (x.snippetHtml ? '<span class="r-snip">' + x.snippetHtml + '</span>' : '') +
        '</a></li>';
    }).join('');
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    clearBtn.hidden = !input.value;
    timer = setTimeout(function () { run(input.value); }, 120);
  });
  /* Enter / "Search" key: search now and drop the keyboard so results show. */
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    clearTimeout(timer);
    run(input.value);
    input.blur();
  });
  clearBtn.addEventListener('click', function () {
    input.value = '';
    run('');
    input.focus();
  });
  suggest.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-q]');
    if (!b) return;
    input.value = b.getAttribute('data-q');
    run(input.value);
    statusEl.scrollIntoView({ block: 'nearest' });
  });

  /* ?q= from the hub's search box, a bookmark, or Back from a result. */
  var q0 = new URLSearchParams(location.search).get('q');
  if (q0) { input.value = q0; run(q0); input.blur(); }
  /* Restored from the back/forward cache with text typed: refresh results. */
  window.addEventListener('pageshow', function (ev) { if (ev.persisted && input.value) { lastQ = null; run(input.value); } });
});
</script>
</body>
</html>
